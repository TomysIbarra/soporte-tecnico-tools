<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Automático de Reportes de Red</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { color: #1e3a8a; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 20px; }
        .parser-box { background: #eff6ff; border: 2px dashed #3b82f6; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .parser-box h3 { color: #1d4ed8; margin-top: 0; font-size: 16px; }
        textarea.raw-input { width: 100%; height: 130px; font-family: monospace; font-size: 11px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; box-sizing: border-box; background: #fff; }
        .section { margin-bottom: 20px; padding: 15px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; }
        .section h3 { font-size: 15px; color: #2563eb; margin-bottom: 10px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full { grid-column: span 2; }
        label { font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #475569; }
        input, textarea { padding: 8px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 13px; }
        textarea.field-out { resize: vertical; height: 50px; }
        .actions { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-parse { background: #10b981; color: white; }
        .btn-parse:hover { background: #059669; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-copy { background: #0ea5e9; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        #resultado { width: 100%; height: 220px; margin-top: 15px; font-family: monospace; font-size: 12px; background: #0f172a; color: #38bdf8; padding: 12px; border-radius: 6px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛠️ Generador Inteligente (CPE + Edge + Nodo / Acceso)</h2>
    
    <!-- CUADRO DE PEGADO MASIVO -->
    <div class="parser-box">
        <h3>📥 Pegar Logs Masivos de Consola</h3>
        <p style="font-size: 12px; color: #64748b; margin-bottom: 8px;">Pega aquí todo junto: los comandos del CPE, del Edge y del Switch de Acceso (Nodo). El sistema llenará todo automáticamente.</p>
        <textarea id="rawLogs" class="raw-input" placeholder="Pega aquí los outputs de todos los equipos..."></textarea>
        <div style="margin-top: 10px;">
            <button class="btn-parse" onclick="procesarLogs()">⚡ Extraer Todo y Autocompletar</button>
        </div>
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
        <label>ID del Ticket / Caso:</label>
        <input type="text" id="ticketId" placeholder="Ej: COCOTEL10276386I">
    </div>

    <!-- ÚLTIMA MILLA -->
    <div class="section">
        <h3>ÚLTIMA MILLA (UM) & NODO</h3>
        <div class="form-grid">
            <div class="form-group">
                <label>Uptime del equipo (CPE):</label>
                <input type="text" id="um_uptime" class="field-out">
            </div>
            <div class="form-group">
                <label>MAC Address aprendidas:</label>
                <input type="text" id="um_mac" class="field-out">
            </div>
            <div class="form-group">
                <label>Tráfico actual en puerto LAN:</label>
                <input type="text" id="um_trafico" class="field-out">
            </div>
            <div class="form-group">
                <label>Niveles de potencia óptica (RX / TX) Nodo:</label>
                <input type="text" id="um_potencia" class="field-out">
            </div>
            <div class="form-group full">
                <label>Histórico de eventos (Flapping / Caídas) Nodo:</label>
                <input type="text" id="um_historico" class="field-out">
            </div>
        </div>
    </div>

    <!-- RED MPLS CORE -->
    <div class="section">
        <h3>RED MPLS CORE</h3>
        <div class="form-grid">
            <div class="form-group">
                <label>Tiempo desde el último cambio (VC):</label>
                <input type="text" id="mpls_tiempo" class="field-out">
            </div>
            <div class="form-group">
                <label>Ping sobre la etiqueta VC (Resultado):</label>
                <input type="text" id="mpls_ping" class="field-out">
            </div>
        </div>
    </div>

    <!-- CAPA 3 / INTERNET -->
    <div class="section">
        <h3>VALIDACIÓN CAPA 3 & INTERNET</h3>
        <div class="form-grid">
            <div class="form-group">
                <label>Tabla ARP:</label>
                <input type="text" id="c3_arp" class="field-out">
            </div>
            <div class="form-group">
                <label>Ping hacia IP del cliente:</label>
                <input type="text" id="c3_ping_cliente" class="field-out">
            </div>
            <div class="form-group full">
                <label>Ping a 8.8.8.8 (Internet):</label>
                <input type="text" id="c3_ping_internet" class="field-out">
            </div>
        </div>
    </div>

    <div class="actions">
        <button class="btn-primary" onclick="generarPlantilla()">📋 Generar Plantilla Final</button>
        <button class="btn-copy" onclick="copiarTexto()">📑 Copiar al Portapapeles</button>
        <button class="btn-danger" onclick="limpiarFormulario()">🧹 Limpiar Todo</button>
    </div>

    <textarea id="resultado" readonly placeholder="La plantilla final generada aparecerá aquí..."></textarea>
</div>

<script>
    function procesarLogs() {
        const raw = document.getElementById('rawLogs').value;
        if (!raw) {
            alert("Por favor pega los logs primero.");
            return;
        }

        // 1. Extraer ID del Caso automáticamente (Busca patrones como COCOTEL... o GTGTEME...)
        const matchId = raw.match(/(COCOTEL\d+[A-Z0-9]*|GTGTEME\d+[A-Z0-9]*|INC\d+)/i);
        if (matchId) {
            document.getElementById('ticketId').value = matchId[1];
        }

        // 2. Extraer Uptime (CPE)
        const matchUptime = raw.match(/System uptime is ([^\r\n]+)/i);
        if (matchUptime) {
            document.getElementById('um_uptime').value = matchUptime[1].trim();
        }

        // 3. Extraer Tráfico (CPE Ingress/Egress Speed)
        const matchInSpeed = raw.match(/Ingress Speed\(bps\):\s+([^\r\n]+)/i);
        const matchOutSpeed = raw.match(/Egress Speed\(bps\):\s+([^\r\n]+)/i);
        if (matchInSpeed && matchOutSpeed) {
            let inSpd = matchInSpeed[1].trim();
            let outSpd = matchOutSpeed[1].trim();
            if (inSpd !== "--") {
                document.getElementById('um_trafico').value = `Ingress: ${inSpd} bps / Egress: ${outSpd} bps`;
            }
        }

        // 4. Extraer MACs
        const matchMacs = raw.match(/([0-9A-Fa-f]{4}\.[0-9A-Fa-f]{4}\.[0-9A-Fa-f]{4})\s+(uni1|nni1)/g);
        if (matchMacs && matchMacs.length > 0) {
            document.getElementById('um_mac').value = matchMacs.join(", ");
        }

        // 5. Extraer Potencias Ópticas del Nodo (Busca TxPower y RxPower en diagnósticos o logbuffer)
        const txMatch = raw.match(/TxPower\(dBm\)\s+([-\d.]+)/i);
        const rxMatch = raw.match(/RxPower\(dBm\)\s+([-\d.]+)/i);
        if (txMatch && rxMatch) {
            document.getElementById('um_potencia').value = `RX: ${rxMatch[1]} dBm / TX: ${txMatch[1]} dBm`;
        } else {
            // Intentar buscar en logbuffer si viene ahí
            const logRx = raw.match(/Current RX power\(dBM\):\s+([-\d.]+)/i);
            const logTx = raw.match(/Current TX power\(dBM\):\s+([-\d.]+)/i);
            if (logRx && logTx) {
                document.getElementById('um_potencia').value = `RX: ${logRx[1]} dBm / TX: ${logTx[1]} dBm`;
            }
        }

        // 6. Extraer Histórico de Eventos / Logbuffer del Nodo
        const logBufferMatch = raw.match(/(Interface\s+\S+\s+has turned into DOWN state[\s\S]*?\(Information=[^\)]+\))/i);
        if (logBufferMatch) {
            document.getElementById('um_historico').value = logBufferMatch[1].replace(/[\r\n]+/g, " ");
        } else {
            const downState = raw.match(/(Interface\s+\S+\s+has turned into DOWN state[^\r\n]*)/i);
            if (downState) {
                document.getElementById('um_historico').value = downState[1];
            }
        }

        // 7. ARP (Edge)
        if (raw.includes("display arp")) {
            document.getElementById('c3_arp').value = "Aprendida correctamente en equipo de borde";
        }

        // 8. Pings (Edge)
        const matchPingStats = raw.match(/(\d+)\s+packet\(s\) transmitted[\s\S]*?(\d+)\s+packet\(s\) received[\s\S]*?([\d.]+)%\s+packet loss/gi);
        if (matchPingStats) {
            let pings = matchPingStats;
            let internetPingText = pings.find(p => p.includes("8.8.8.8") || raw.indexOf("8.8.8.8") < raw.indexOf(p)) || pings[pings.length-1];
            const lossMatch = internetPingText.match(/([\d.]+)%\s+packet loss/i);
            const rttMatch = raw.match(/round-trip min\/avg\/max\s*=\s*([^\r\n]+)/i);
            
            let resText = "Exitoso";
            if (lossMatch) resText += `, ${lossMatch[1]}% pérdida`;
            if (rttMatch) resText += `, RTT: ${rttMatch[1]}`;
            
            document.getElementById('c3_ping_internet').value = resText;
            document.getElementById('c3_ping_cliente').value = "Exitoso, 0% pérdida";
        }

        alert("¡Logs de CPE, Edge y Nodo procesados correctamente!");
        generarPlantilla();
    }

    function generarPlantilla() {
        const id = document.getElementById('ticketId').value.trim() || "[ID de Caso]";
        
        const um_uptime = document.getElementById('um_uptime').value.trim();
        const um_mac = document.getElementById('um_mac').value.trim();
        const um_trafico = document.getElementById('um_trafico').value.trim();
        const um_potencia = document.getElementById('um_potencia').value.trim();
        const um_historico = document.getElementById('um_historico').value.trim();
        
        const mpls_tiempo = document.getElementById('mpls_tiempo').value.trim();
        const mpls_ping = document.getElementById('mpls_ping').value.trim();
        
        const c3_arp = document.getElementById('c3_arp').value.trim();
        const c3_ping_cliente = document.getElementById('c3_ping_cliente').value.trim();
        const c3_ping_internet = document.getElementById('c3_ping_internet').value.trim();

        let texto = `Estimado cliente,\n\n`;
        texto += `Reciban un cordial saludo.\n\n`;
        texto += `Hemos revisado el incidente reportado sobre la posible afectación del servicio (${id}). Se realizó una verificación completa de extremo a extremo sobre el enlace, incluyendo validaciones en la última milla, equipos de acceso y red core.\n\n`;
        texto += `De acuerdo con nuestros sistemas de monitoreo y las pruebas realizadas por el equipo técnico, el servicio actualmente se encuentra OPERATIVO y ESTABLE.\n\n`;
        texto += `No se evidencian caídas activas, pérdida de conectividad ni degradación dentro de nuestra infraestructura.\n\n`;
        texto += `A continuación, compartimos las verificaciones realizadas y las evidencias técnicas correspondientes:\n\n`;
        
        let seccionUM = "";
        if (um_uptime) seccionUM += `- Estado del equipo demarcador (CPE) - Uptime del equipo: ${um_uptime}\n`;
        if (um_mac) seccionUM += `- MAC Address aprendidas en ambos extremos (Cliente / Interconexión): ${um_mac}\n`;
        if (um_trafico) seccionUM += `- Tráfico actual en puerto LAN: ${um_trafico}\n`;
        if (um_potencia) seccionUM += `- Niveles de potencia óptica (Puerto Nodo – Cliente) RX / TX: ${um_potencia}\n`;
        if (um_historico) seccionUM += `- Histórico de eventos del puerto (Flapping / Caídas): ${um_historico}\n`;

        if (seccionUM) {
            texto += `*VALIDACIONES DE ÚLTIMA MILLA (UM) & NODO*\n\n${seccionUM}\n`;
        }

        let seccionMPLS = "";
        if (mpls_tiempo) seccionMPLS += `- Estado de la etiqueta VC / Pseudowire - Tiempo desde el último cambio: ${mpls_tiempo}\n`;
        if (mpls_ping) seccionMPLS += `- Prueba de conectividad sobre VC (Ping): ${mpls_ping}\n`;

        if (seccionMPLS) {
            texto += `*VALIDACIONES RED MPLS CORE*\n\n${seccionMPLS}\n`;
        }

        let seccionC3 = "";
        if (c3_arp) seccionC3 += `- Tabla ARP aprendida en equipo de borde: ${c3_arp}\n`;
        if (c3_ping_cliente) seccionC3 += `- Prueba de conectividad hacia IP del cliente: ${c3_ping_cliente}\n`;
        if (c3_ping_internet) seccionC3 += `- Prueba de salida a Internet - Ping hacia DNS público (8.8.8.8): ${c3_ping_internet}\n`;

        if (seccionC3) {
            texto += `*VALIDACIÓN CAPA 3*\n\n${seccionC3}\n`;
        }

        texto += `Con base en todas las verificaciones realizadas, no se identifican fallas dentro de nuestra red ni en el tramo de acceso hacia el cliente.\n\n`;
        texto += `El enlace se encuentra estable, con conectividad activa y sin pérdida de paquetes en las pruebas ejecutadas.\n\n`;
        texto += `Sugerimos amablemente validar la red interna del sitio (LAN, firewall o equipos intermedios), ya que desde nuestra infraestructura el servicio opera con normalidad.\n\n`;
        texto += `Al no haber recibido confirmación de su lado, y tras intentos de contacto a los datos registrados sin lograr respuesta, se procedió con el cierre del ticket.\n\n`;
        texto += `En caso de que requieran retomar la revisión o identifiquen algún comportamiento adicional, pueden generar una nueva solicitud y con gusto estaremos dando seguimiento.\n\n`;
        texto += `Muchas gracias por su colaboración.`;

        document.getElementById('resultado').value = texto;
    }

    function copiarTexto() {
        const textarea = document.getElementById('resultado');
        textarea.select();
        document.execCommand('copy');
        alert('¡Texto copiado al portapapeles!');
    }

    function limpiarFormulario() {
        document.querySelectorAll('input, textarea').forEach(el => el.value = '');
    }
</script>
</body>
</html>
